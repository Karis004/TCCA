name: personal-gateway

services:
  caddy:
    image: caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    container_name: personal-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND_IP:?Set GATEWAY_BIND_IP to the primary server IPv4}:80:80/tcp"
      - "${GATEWAY_BIND_IP:?Set GATEWAY_BIND_IP to the primary server IPv4}:443:443/tcp"
    volumes:
      - type: bind
        source: ./caddy
        target: /etc/caddy
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GATEWAY_STATE_DIR:-/var/lib/personal-gateway}/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${GATEWAY_STATE_DIR:-/var/lib/personal-gateway}/config
        target: /config
        bind:
          create_host_path: false
    networks:
      - tcca_backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

networks:
  tcca_backend:
    external: true
    name: tcca_default
